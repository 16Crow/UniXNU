name: sheng shader prime resources
on:
  push:
    branches: [sheng-evidence]
    paths: [.github/workflows/sheng-prime-resources.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Collect matching OS shader resources without compiling
        env:
          GH_TOKEN: ${{ github.token }}
          UNIXNU_EXPORT_PASSWORD: ${{ secrets.UNIXNU_EXPORT_PASSWORD }}
        run: |
          set -euo pipefail
          STAGE=$RUNNER_TEMP/sheng-prime
          python3 scripts/collect-sheng-prime-resources.py "$STAGE"
          tar -C "$STAGE/prime-resources" -cf - . \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
              -pass env:UNIXNU_EXPORT_PASSWORD > "$STAGE/prime-resources.enc"
          (cd "$STAGE" && shasum -a 256 prime-resources.enc > SHA256SUMS)
          TAG=sheng-prime-resources-$GITHUB_RUN_ID
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "sheng shader resources $GITHUB_RUN_ID" --notes 'Encrypted matching shader list and cryptex resources; no kernel rebuild.'
          gh release upload "$TAG" "$STAGE/prime-resources.enc" "$STAGE/SHA256SUMS" --repo "$GITHUB_REPOSITORY"
